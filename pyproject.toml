[project]
name = "health-pricing"
version = "0.1.0"
description = "UK-style PMI pricing models built on US MEPS survey data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
    "pandas>=2.2",
    "requests>=2.32",
    "pyyaml>=6.0",
    "statsmodels>=0.15.0",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pypdf>=6.21.4",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_pricing"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
