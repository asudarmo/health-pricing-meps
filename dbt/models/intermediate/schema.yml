  - name: int_person_exposure
    description: Exposure in years (months in scope divided by 12) for each person-year.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [DUPERSID, year]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "exposure is not null and exposure > 0 and exposure <= 1"
          config:
            where: "exposure is null or exposure <> 0"
    columns:
      - name: exposure_months
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 12
      - name: exposure
        description: >
          Years in scope. The model-level error test requires more than 0 and at most 1 for everyone
          except people with exactly 0. The warning test below lists people with no exposure at all,
          which #14 handles.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                severity: warn

  - name: price_index_factor
    description: >
      PCE-Health on-level factor from 2022 to 2023 prices, from the committed BEA download in
      data/reference/pce_health.csv.
    columns:
      - name: factor
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1.00
                max_value: 1.10
                inclusive: false

  - name: int_person_claims
    description: >
      PMI-scope claim count and cost per person-year under the approved definition, with costs also
      on-levelled to 2023 prices. Stays that began in the emergency room are in the er_stay columns.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [DUPERSID, year]
    columns:
      - name: claim_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: claim_cost
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: claim_cost_2023_prices
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: er_stay_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: er_stay_cost
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
