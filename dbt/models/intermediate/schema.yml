version: 2

# Value-level rules after the reserved-code treatment (issue #12). No reserved negative code is
# allowed on a cleaned column. The only negative value left is -1 on the round dates and
# eligibility columns, where it means "not in that round" and feeds the exposure measure (#13).
# The treatment itself is logged in _docs/decisions.md (2026-11-01, reserved-code treatment).

models:
  - name: int_person_clean
    description: One row per person-year for 2022 and 2023 with reserved codes treated.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [DUPERSID, year]
    columns:
      - name: year
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2022, 2023]
                quote: false
      - name: DUPERSID
        data_tests:
          - not_null
      - name: age
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 85
      - name: age_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['year_end', 'last_eligible']
      - name: age_topcoded
        data_tests:
          - not_null
      - name: region_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['year_end', 'last_round']
      - name: left_survey_early
        description: >
          Analysis only. True when the person was no longer eligible at the end of the year. It
          must never be used as a rating factor.
        data_tests:
          - not_null
      - name: SEX
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: region
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
      - name: inscov
        data_tests:
