version: 2

sources:
  - name: raw
    description: >
      Tables loaded by src/health_pricing/data/load.py from AHRQ's fixed-width ASCII files,
      using AHRQ's own SAS column layout. One table per raw file, every variable AHRQ publishes.
    schema: raw
    tables:
      - name: fyc_2022
        description: 2022 Full-Year Consolidated file (HC-243), one row per person.
        columns:
          - name: DUPERSID
            tests:
              - unique
              - not_null
      - name: fyc_2023
        description: 2023 Full-Year Consolidated file (HC-251), one row per person.
        columns:
          - name: DUPERSID
            tests:
              - unique
              - not_null
      - name: office_based_2022
        description: 2022 office-based medical provider visits (HC-239G), one row per event.
      - name: office_based_2023
        description: 2023 office-based medical provider visits (HC-248G), one row per event.
      - name: outpatient_2022
        description: 2022 outpatient department visits (HC-239F), one row per event.
      - name: outpatient_2023
        description: 2023 outpatient department visits (HC-248F), one row per event.
      - name: inpatient_2022
        description: 2022 hospital inpatient stays (HC-239D), one row per event.
      - name: inpatient_2023
        description: 2023 hospital inpatient stays (HC-248D), one row per event.
